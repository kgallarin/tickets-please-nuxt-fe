name: pr-checks-parallel.yml

on:
  pull_request:
    branches:
      - main
  push:
      branches:
        - main

jobs:
  ts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
        with:
          node-version: '24'
      - run: npm run tsc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
        with:
          node-version: '24'
      - run: npm run lint:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
        with:
          node-version: '24'
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
        with:
          node-version: '24'
      - run: npm run build








